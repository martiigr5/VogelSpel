<div class="level1-wrapper">
  <app-header
    [toonTerug]="true"
    [toonUitloggen]="false"
    (terugGeklikt)="terugNaarMenu()"
  />

  @if (loading()) {
    <div class="loading">Laden...</div>
  }

  @if (!loading()) {
    <app-klank-banner
      [items]="items()"
      (itemVerwerkt)="onItemVerwerkt($event)"
      (levelVoltooid)="onLevelVoltooid()"
      (gevondenGewijzigd)="onGevondenGewijzigd($event)"
    />

    <app-scene
      [items]="items()"
      [gevonden]="gevonden()"
      [sceneImage]="sceneImage"
      (itemGeklikt)="onItemGeklikt($event)"
    />

    <app-game-footer
      (gestopt)="terugNaarMenu()"
    />
  }

  @if (levelKlaar()) {
    <app-level-klaar
      [score]="score()"
      (terugNaarMenu)="terugNaarMenu()"
    />
    
  }
</div>
