<div class="level1-wrapper">
  <app-header
    [gebruikersnaam]="gebruikersnaam"
    [klas]="klas"
    [toonTerug]="true"
    [toonUitloggen]="false"
    (terugGeklikt)="terugNaarMenu()"
  />

  @if (loading()) {
    <div class="loading">Laden...</div>
  }

  @if (!loading()) {
    <app-klank-banner
      [items]="items()"
      (itemVerwerkt)="onItemVerwerkt($event)"
      (levelVoltooid)="onLevelVoltooid()"
    />

    <app-scene
      [items]="items()"
      [gevonden]="klankBanner?.gevonden ?? new Set()"
      [sceneImage]="sceneImage"
      (itemGeklikt)="onItemGeklikt($event)"
    />

    <footer class="game-footer">
      <button class="footer-btn pauze">Pauze ⏱</button>
      <button class="footer-btn help">Help ?</button>
      <button class="footer-btn stoppen" (click)="terugNaarMenu()">Stoppen ⊖</button>
    </footer>
  }

  @if (levelKlaar()) {
    <div class="level-klaar-overlay">
      <div class="level-klaar-card">
        <h2>🎉 Level voltooid!</h2>
        <button class="btn-primary" (click)="terugNaarMenu()">Terug naar menu</button>
      </div>
    </div>
  }
</div>
