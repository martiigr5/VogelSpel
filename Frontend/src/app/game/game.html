<div class="game-wrapper">
  <header class="game-header">
    <div class="user-info">
      <span class="username">{{ gebruikersnaam }}</span>
      <span class="klas">Klas: {{ klas }}</span>
    </div>
    <button class="btn-terug" (click)="terugNaarMenu()">Terug</button>
    <div class="logo">
      <h1><span class="highlight">Het</span><span class="main">Vogelspel</span></h1>
    </div>
  </header>

  <main class="game-main">
    @if (loading()) {
      <div class="loading">Laden...</div>
    }

    @if (!loading()) {
      <div class="levels-grid">
        @for (level of levels(); track level.id) {
          <div class="level-card" (click)="startLevel(level)">
            <div class="level-top">
              <span class="level-number">{{ level.level_number }}</span>
              <span class="badge" [class]="getBadgeClass(level)">{{ getBadgeLabel(level) }}</span>
            </div>
            <div class="level-info">
              <h3>{{ getLevelNaam(level) }}</h3>
              <p>{{ level.description }}</p>
            </div>
          </div>
        }
      </div>
    }
  </main>
</div>
