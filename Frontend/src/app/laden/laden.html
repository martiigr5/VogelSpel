<div class="laden-wrapper">
  <app-header
    [gebruikersnaam]="gebruikersnaam"
    [klas]="klas"
    [toonTerug]="true"
    [toonUitloggen]="false"
    (terugGeklikt)="terugNaarMenu()"
  />

  <main class="laden-main">
    @if (loading()) {
      <div class="loading">Laden...</div>
    }

    @if (!loading() && sessies().length === 0) {
      <div class="leeg">
        <p>Geen opgeslagen spellen gevonden.</p>
        <button class="btn-primary" (click)="terugNaarMenu()">Terug naar menu</button>
      </div>
    }

    @if (!loading() && sessies().length > 0) {
      <div class="sessies-lijst">
        @for (sessie of sessies(); track sessie.id) {
          <app-sessie-kaart
            [sessie]="sessie"
            (geladen)="laadSessie($event)"
            (verwijderd)="verwijderSessie($event)"
          />
        }
      </div>
    }
  </main>
</div>
