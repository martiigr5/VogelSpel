<div class="menu-wrapper">
  <app-header
    [gebruikersnaam]="gebruikersnaam"
    [klas]="klas"
    [toonTerug]="false"
    [toonUitloggen]="false"
  />

  <main class="menu-main">
    <div class="menu-grid">
      <app-menu-knop
        label="Nieuw Spel"
        icon="🎮"
        [actief]="true"
        (geklikt)="newGame()"
      />
      <app-menu-knop
        label="Spel Laden"
        icon="💾"
        [actief]="true"
        (geklikt)="loadGame()"
      />
      <app-menu-knop
        label="Opties"
        icon="⚙️"
        [uitgeschakeld]="true"
      />
      <app-menu-knop
        label="Logout"
        icon="🚪"
        [actief]="true"
        (geklikt)="logout()"
      />
    </div>
  </main>
</div>
